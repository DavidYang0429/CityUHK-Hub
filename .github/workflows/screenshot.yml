name: Screenshot

# main 推送后重抓首页截图覆盖 web/public/screenshot.png，并更新 README 的截图时间标注。
# 截图是二进制文件，一旦要 rebase 就无法自动合并，所以提交前先对齐到最新 origin/main，
# 保证 push 一定快进。GITHUB_TOKEN 的 push 不触发工作流，PR 合并后由 feature-to-main.yml
# 用 workflow_dispatch 点名触发；那种情况 Vercel 还在构建，截图前要等部署完成。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# 单独一组：原先和 main-sync 共用 readme-writer，截图等部署时会把它一起堵住，
# 连带卡死 main→feature 同步。两边提交前都会 fetch+reset 到最新 main，写 README 的竞争能自愈。
concurrency:
  group: screenshot-writer
  cancel-in-progress: false

jobs:
  capture:
    name: 抓取首页截图并提交
    # 机器人推的截图提交带 [skip-shot]、actor 也是 github-actions[bot]，都跳过，避免自我循环。
    if: ${{ github.event_name != 'push' || (!contains(github.event.head_commit.message, '[skip-shot]') && github.actor != 'github-actions[bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 安装 Chromium
        run: npx playwright install --with-deps chromium

      - name: 配置 git 身份
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 等待站点部署完成
        id: wait-deploy
        # 截图抓线上站点，Vercel 收到推送要重新构建才发布，不等就拍到上一版。判据：
        # /data/projects.json 里构建时写入的 generatedAt 晚于本次提交时间，说明已上线。
        # 等不到就整轮跳过（见下一步的 if），不提交过期截图。
        env:
          DEPLOY_READY_URL: https://cityu-hub.bond/data/projects.json
        run: |
          set -euo pipefail
          git fetch -q origin main
          commit_epoch="$(git log -1 --format=%ct origin/main)"
          target=$((commit_epoch - 60))
          deadline=$(( $(date +%s) + 300 ))

          while [ "$(date +%s)" -lt "$deadline" ]; do
            generated="$(curl -fsS --max-time 20 "$DEPLOY_READY_URL" 2>/dev/null | node -e 'let s="";process.stdin.on("data",(d)=>s+=d).on("end",()=>{try{process.stdout.write(String(JSON.parse(s).generatedAt??""))}catch{process.stdout.write("")}})' || true)"

            if [ -n "$generated" ]; then
              built_epoch="$(node -e 'const t=Date.parse(process.argv[1]);process.stdout.write(Number.isNaN(t)?"0":String(Math.floor(t/1000)))' "$generated" 2>/dev/null || echo 0)"
              if [ "$built_epoch" -ge "$target" ]; then
                echo "站点已更新到本次提交：generatedAt=${generated}"
                echo "ready=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "部署尚未完成：generatedAt=${generated}（${built_epoch} < ${target}），15 秒后再查"
            else
              echo "站点暂不可达，15 秒后再查"
            fi
            sleep 15
          done

          # 线上还是旧版本，拍到的是过期页面，宁可不更新也不写进仓库。
          echo "等待部署超时（5 分钟），跳过本轮截图" >&2
          echo "ready=false" >> "$GITHUB_OUTPUT"

      - name: 抓取截图并在最新远端基线上提交
        if: steps.wait-deploy.outputs.ready == 'true'
        env:
          SITE_URL: https://cityu-hub.bond/
        run: |
          set -euo pipefail

          for attempt in 1 2 3; do
            echo "=== 第 ${attempt} 次尝试 ==="

            git fetch origin main
            git reset --hard origin/main

            node scripts/update-screenshot.mjs

            if git diff --quiet -- web/public/screenshot.png README.md; then
              echo "截图与标注都没有变化，跳过提交"
              exit 0
            fi

            git add web/public/screenshot.png README.md
            git commit -m "chore(screenshot): 更新站点首页截图 [skip-shot]"

            if git push origin main; then
              echo "已推送到 main"
              exit 0
            fi

            echo "推送被拒：远端在生成期间有了新提交，重新对齐后重试"
            sleep 5
          done

          echo "连续 3 次推送失败，放弃" >&2
          exit 1
